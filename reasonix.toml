[permissions]
allow = ["Bash=cd src && node --input-type=module -e \"\nimport { calcArea, calcCurrent, minAreaForCurrent } from './calc/currentCalc.js';\n// 验证 calcArea 的 prev 死变量问题\nfor (const c of [10, 15.4, 15.5, 16, 20, 30]) {\n  const s = calcArea(c);\n  console.log('current=' + c, '-> minArea=' + minAreaForCurrent(c).toFixed(3), '-> calcArea=' + s, ' calcCurrent(' + s + ')=' + calcCurrent(s));\n}\nconsole.log('---');\nconsole.log('calcCurrent(1.5) =', calcCurrent(1.5), ' calcCurrent(2.5) =', calcCurrent(2.5));\nconsole.log('calcArea(0) =', calcArea(0));\nconsole.log('calcArea(-5) =', calcArea(-5), '(NaN 时输出被静默吞掉)');\nconsole.log('calcResistance(0) 由 powerResistorCalc: 290.4/0 =', 290.4/0);\n\"", "Bash=node --check public/sw.js && echo \"SYNTAX OK\" && node --input-type=module -e \"\nimport { readFileSync } from 'node:fs';\nconst html = readFileSync('dist/index.html', 'utf8');\nasync function collectPrecacheUrls(html) {\n  const urls = new Set(['./', './index.html']);\n  const re = /(?:src|href)=\\\"([^\\\"]+)\\\"/g;\n  let m;\n  while ((m = re.exec(html))) {\n    const url = m[1];\n    if (url && !url.startsWith('http://') && !url.startsWith('https://') && !url.startsWith('//') && !url.startsWith('data:') && !url.startsWith('#') && !url.startsWith('mailto:')) {\n      urls.add(url);\n    }\n  }\n  return [...urls];\n}\nconsole.log('预缓存清单:', JSON.stringify(await collectPrecacheUrls(html), null, 2));\n\""]
